name: Build release assets (MCPB bundles and npm tarball)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to attach the bundles to (leave empty to only build)
        required: false

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:mcpb
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .mcpb-build/*.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ matrix.os }}
          path: .mcpb-build/*.mcpb
          if-no-files-found: error
          # .mcpb-build is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" .mcpb-build/*.mcpb --clobber

  tarball:
    # Prebuilt npm tarball that every client config launches via npx. No npm registry publish.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pack release tarball
        run: |
          mkdir -p .tarball-build
          npm pack --pack-destination .tarball-build
          ls -l .tarball-build
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .tarball-build/youtube-mcp-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: .tarball-build/youtube-mcp-*.tgz
          if-no-files-found: error
          include-hidden-files: true
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          test -f ".tarball-build/youtube-mcp-${VERSION}.tgz" || { echo "::error::tarball version does not match tag $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" ".tarball-build/youtube-mcp-${VERSION}.tgz" --clobber
