# npm publish is not approved yet (2026-10-27); enabling needs Pratik's yes and npm trusted-publisher setup.
#
# Inert by design: manual trigger only (no tag trigger), and the first step fails
# while package.json has "private": true. Publishing uses npm trusted publishing
# (OIDC), so no npm token secret is used or needed.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse to publish while the package is private
        shell: bash
        run: |
          if node -e 'process.exit(require("./package.json").private === true ? 0 : 1)'; then
            echo "::error::npm publish is not approved: package.json has \"private\": true. Removing it needs Pratik's explicit yes and the npm trusted-publisher setup (npmjs.com package settings, repo pratikgh0se/youtube-mcp, workflow publish.yml)."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
