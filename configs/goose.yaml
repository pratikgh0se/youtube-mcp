# Add under `extensions:` in ~/.config/goose/config.yaml
extensions:
  youtube-mcp:
    type: stdio
    name: youtube-mcp
    enabled: true
    cmd: npx
    args: ["-y", "https://github.com/pratikgh0se/youtube-mcp/releases/download/v0.3.0/youtube-mcp-0.3.0.tgz", "--transport", "stdio"]
    envs:
      YOUTUBE_API_KEY: "<your-youtube-api-key>"
    timeout: 300
