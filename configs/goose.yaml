# Add under `extensions:` in ~/.config/goose/config.yaml
extensions:
  youtube-mcp:
    type: stdio
    name: youtube-mcp
    enabled: true
    cmd: npx
    args: ["-y", "github:pratikgh0se/youtube-mcp#v0.2.0", "--transport", "stdio"]
    envs:
      YOUTUBE_API_KEY: "<your-youtube-api-key>"
    timeout: 300
